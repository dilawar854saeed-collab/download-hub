<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Hub by Dilawar</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:#fff;
}

header{
  background:#020617;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.search-box{
  width:90%;
  max-width:600px;
  margin:15px auto;
  display:block;
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:16px;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.card-content{
  padding:15px;
}

.card h3{
  margin:0 0 10px;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.watch{
  background:#3b82f6;
  color:#fff;
}

.download{
  background:#ef4444;
  color:#fff;
}

/* Category buttons */
.categories{
  text-align:center;
  margin-top:10px;
}

.categories button{
  margin:5px;
  padding:8px 15px;
  border-radius:20px;
  background:#334155;
  color:#fff;
  border:none;
  cursor:pointer;
}

.categories button.active{
  background:#22c55e;
}
</style>
</head>

<body>

<header>🚀 Download Hub by Dilawar</header>

<input type="text" id="search" class="search-box" placeholder="🔍 Search movies...">

<div class="categories">
  <button onclick="filterCategory('all')" class="active">All</button>
  <button onclick="filterCategory('action')">Action</button>
  <button onclick="filterCategory('horror')">Horror</button>
  <button onclick="filterCategory('drama')">Drama</button>
</div>

<div class="container" id="movies"></div>

<script>
// 🎬 Movie Data (EDIT HERE ONLY)
const movies = [
  {
    title:"Dhurandhar 2025",
    category:"action",
    img:"https://via.placeholder.com/300x180.png?text=Dhurandhar",
    link:"https://t.me/downloadhubdilawar/3"
  },
  {
    title:"Horror Night",
    category:"horror",
    img:"https://via.placeholder.com/300x180.png?text=Horror",
    link:"https://t.me/downloadhubdilawar/3"
  },
  {
    title:"Love Story",
    category:"drama",
    img:"https://via.placeholder.com/300x180.png?text=Drama",
    link:"https://t.me/downloadhubdilawar/3"
  }
];

let currentCategory = "all";

function displayMovies(){
  const container = document.getElementById("movies");
  container.innerHTML = "";

  const search = document.getElementById("search").value.toLowerCase();

  movies.forEach(movie => {
    if(
      (currentCategory === "all" || movie.category === currentCategory) &&
      movie.title.toLowerCase().includes(search)
    ){
      container.innerHTML += `
        <div class="card">
          <img src="${movie.img}">
          <div class="card-content">
            <h3>${movie.title}</h3>
            <div class="buttons">
              <a href="${movie.link}" target="_blank">
                <button class="watch">▶ Watch</button>
              </a>
              <a href="${movie.link}?single" target="_blank">
                <button class="download">⬇ Download</button>
              </a>
            </div>
          </div>
        </div>
      `;
    }
  });
}

// 🔎 Search
document.getElementById("search").addEventListener("input", displayMovies);

// 📂 Category filter
function filterCategory(cat){
  currentCategory = cat;

  document.querySelectorAll(".categories button").forEach(btn=>{
    btn.classList.remove("active");
  });

  event.target.classList.add("active");

  displayMovies();
}

// Load first time
displayMovies();
</script>

</body>
</html>
