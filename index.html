<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Hub by Dilawar</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f1a;
  color:#fff;
}

header{
  text-align:center;
  padding:15px;
  font-size:22px;
  background:#020617;
}

.search{
  width:90%;
  margin:10px auto;
  display:block;
  padding:12px;
  border-radius:8px;
  border:none;
}

/* TRENDING */
.slider{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}

.slider img{
  width:180px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.slider img:hover{
  transform:scale(1.1);
}

/* CATEGORY */
.categories{
  text-align:center;
}

.categories button{
  margin:5px;
  padding:8px 15px;
  border:none;
  border-radius:20px;
  background:#1e293b;
  color:#fff;
  cursor:pointer;
}

.categories button.active{
  background:#22c55e;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:240px;
  object-fit:cover;
}

.card h3{
  padding:10px;
  font-size:16px;
}

.btns{
  display:flex;
  gap:5px;
  padding:10px;
}

.btns button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.watch{background:#3b82f6;color:#fff;}
.download{background:#ef4444;color:#fff;}
</style>
</head>

<body>

<header>🎬 Download Hub by Dilawar</header>

<input class="search" placeholder="🔍 Search movies..." id="search">

<h3 style="padding-left:10px;">🔥 Trending</h3>
<div class="slider" id="trending"></div>

<div class="categories">
  <button class="active" onclick="setCategory('all',this)">All</button>
  <button onclick="setCategory('action',this)">Action</button>
  <button onclick="setCategory('horror',this)">Horror</button>
  <button onclick="setCategory('drama',this)">Drama</button>
</div>

<div class="grid" id="movies"></div>

<script>

// 🎬 MOVIE DATA (EDIT HERE ONLY)
const moviesData = [
{
title:"Dhurandhar 2025",
category:"action",
img:"https://via.placeholder.com/300x400.png?text=Dhurandhar",
link:"https://t.me/downloadhubdilawar/3",
trending:true
},
{
title:"Horror Night",
category:"horror",
img:"https://via.placeholder.com/300x400.png?text=Horror",
link:"https://t.me/downloadhubdilawar/3",
trending:true
},
{
title:"Love Story",
category:"drama",
img:"https://via.placeholder.com/300x400.png?text=Drama",
link:"https://t.me/downloadhubdilawar/3",
trending:false
},
{
title:"How to train your dragon",
category:"action",
img:"https://via.placeholder.com/300x400.png?text=New+Movie",
link:"https://t.me/downloadhubdilawar/6",
trending:true
},
];

let currentCategory = "all";

// LOAD TRENDING
function loadTrending(){
  const box = document.getElementById("trending");
  box.innerHTML="";

  moviesData.filter(m=>m.trending).forEach(m=>{
    box.innerHTML += `
      <img src="${m.img}" 
      onerror="this.src='https://via.placeholder.com/300x400?text=No+Image'"
      onclick="openLink('${m.link}')">
    `;
  });
}

// SHOW MOVIES
function showMovies(){
  const box = document.getElementById("movies");
  const search = document.getElementById("search").value.toLowerCase();

  box.innerHTML="";

  moviesData.forEach(m=>{
    if(
      (currentCategory==="all" || m.category===currentCategory) &&
      m.title.toLowerCase().includes(search)
    ){
      box.innerHTML += `
        <div class="card">
          <img src="${m.img}" 
          onerror="this.src='https://via.placeholder.com/300x400?text=No+Image'">

          <h3>${m.title}</h3>

          <div class="btns">
            <button class="watch" onclick="openLink('${m.link}')">▶ Watch</button>
            <button class="download" onclick="openLink('${m.link}')">⬇ Download</button>
          </div>
        </div>
      `;
    }
  });
}

// CATEGORY FIX (NO BUG)
function setCategory(cat,btn){
  currentCategory = cat;

  document.querySelectorAll(".categories button")
  .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  showMovies();
}

// OPEN LINK
function openLink(link){
  window.open(link,"_blank");
}

// SEARCH
document.getElementById("search")
.addEventListener("input",showMovies);

// INIT
loadTrending();
showMovies();

</script>

</body>
</html>
