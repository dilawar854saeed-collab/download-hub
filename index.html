<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Hub by Dilawar</title>

<!-- SEO -->
<meta name="description" content="Download Hub by Dilawar - Movies Download & Watch">
<meta name="keywords" content="movies, download, telegram movies">
<meta name="author" content="Dilawar">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

/* HEADER */
header {
  text-align: center;
  padding: 15px;
  background: #020617;
  font-size: 22px;
  font-weight: bold;
}

/* SEARCH */
.search {
  width: 90%;
  margin: 15px auto;
  display: block;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

/* GRID */
.movies {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
  gap: 15px;
  padding: 15px;
}

/* CARD */
.card {
  background: #1e293b;
  border-radius: 12px;
  overflow: hidden;
  text-align: center;
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.card h3 {
  font-size: 14px;
  padding: 5px;
}

.btns {
  display: flex;
  justify-content: space-around;
  padding: 10px;
}

button {
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.watch { background: #3b82f6; color: white; }
.download { background: #ef4444; color: white; }

/* ADMIN */
.admin {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background: #020617;
  padding: 10px;
  border-radius: 10px;
}

.admin input {
  display: block;
  margin: 5px 0;
  padding: 5px;
  width: 180px;
}

.admin button {
  width: 100%;
  background: green;
  color: white;
}

</style>
</head>

<body>

<header>🚀 Download Hub by Dilawar</header>

<input type="text" class="search" placeholder="Search movies..." onkeyup="searchMovie(this.value)">

<div id="movies" class="movies"></div>

<!-- ADMIN PANEL -->
<div class="admin">
  <input id="title" placeholder="Movie Title">
  <input id="img" placeholder="Poster URL">
  <input id="link" placeholder="Telegram Link">
  <button onclick="addMovie()">Add Movie</button>
</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPq7MhUJZsLXd-KseYkXY04aWVkoUtT9A",
  authDomain: "downlode-hub-by-dilawar.firebaseapp.com",
  databaseURL: "https://downlode-hub-by-dilawar-default-rtdb.firebaseio.com/",
  projectId: "downlode-hub-by-dilawar",
  storageBucket: "downlode-hub-by-dilawar.firebasestorage.app",
  messagingSenderId: "464345954287",
  appId: "1:464345954287:web:457e765158dadb2302681a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const moviesRef = ref(db, "movies");

// SHOW MOVIES
let allMovies = [];

onValue(moviesRef, (snapshot) => {
  const data = snapshot.val();
  allMovies = [];

  for (let id in data) {
    allMovies.push(data[id]);
  }

  renderMovies(allMovies);
});

// RENDER
function renderMovies(list){
  const box = document.getElementById("movies");
  box.innerHTML = "";

  list.forEach(m => {
    box.innerHTML += `
    <div class="card">
      <img src="${m.img}">
      <h3>${m.title}</h3>
      <div class="btns">
        <button class="watch" onclick="openLink('${m.link}')">▶ Watch</button>
        <button class="download" onclick="openLink('${m.link}')">⬇ Download</button>
      </div>
    </div>`;
  });
}

// ADD MOVIE
window.addMovie = function(){
  const title = document.getElementById("title").value;
  const img = document.getElementById("img").value;
  const link = document.getElementById("link").value;

  push(moviesRef, {title, img, link});
  alert("Movie Added!");
};

// OPEN LINK
window.openLink = function(link){
  window.open(link,"_blank");
};

// SEARCH
window.searchMovie = function(val){
  const filtered = allMovies.filter(m => 
    m.title.toLowerCase().includes(val.toLowerCase())
  );
  renderMovies(filtered);
};

</script>

</body>
</html>
