<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Hub by Dilawar</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b132b;
  color:white;
}

/* HEADER */
header{
  text-align:center;
  padding:15px;
  background:#0f172a;
  font-size:22px;
  font-weight:bold;
}

/* SEARCH */
.search-box{
  width:80%;
  margin:20px auto;
}
.search-box input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

/* MOVIE GRID */
.movies{
  display:flex;
  flex-wrap:wrap;
  gap:25px;
  padding:20px;
  justify-content:center;
}

/* CARD */
.card{
  background:#1e293b;
  border-radius:15px;
  width:230px;
  overflow:hidden;
  transition:0.3s;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

/* HOVER EFFECT (NETFLIX STYLE) */
.card:hover{
  transform:scale(1.1);
  z-index:10;
}

/* IMAGE */
.card img{
  width:100%;
  height:320px;
  object-fit:cover;
}

/* TITLE */
.card h3{
  text-align:center;
  padding:10px;
  font-size:18px;
}

/* BUTTONS */
.buttons{
  display:flex;
  justify-content:space-around;
  padding:10px;
}

.watch{
  background:#3b82f6;
  padding:8px 12px;
  border-radius:8px;
  text-decoration:none;
  color:white;
}

.download{
  background:#ef4444;
  padding:8px 12px;
  border-radius:8px;
  text-decoration:none;
  color:white;
}

/* ADMIN PANEL */
.admin{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  padding:15px;
  border-radius:10px;
}

.admin input{
  display:block;
  margin:5px 0;
  padding:8px;
  width:200px;
}

.admin button{
  background:green;
  color:white;
  border:none;
  padding:8px;
  width:100%;
}
</style>
</head>

<body>

<header>🚀 Download Hub by Dilawar</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Search movies...">
</div>

<div class="movies" id="movies"></div>

<!-- ADMIN PANEL -->
<div class="admin">
  <input id="title" placeholder="Movie Title">
  <input id="poster" placeholder="Poster URL">
  <input id="link" placeholder="Telegram Link">
  <button onclick="addMovie()">Add Movie</button>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPq7MhUJZsLXd-KseYkXY04aWVkoUtT9A",
  authDomain: "downlode-hub-by-dilawar.firebaseapp.com",
  databaseURL: "https://downlode-hub-by-dilawar-default-rtdb.firebaseio.com",
  projectId: "downlode-hub-by-dilawar",
  storageBucket: "downlode-hub-by-dilawar.appspot.com",
  messagingSenderId: "464345954287",
  appId: "1:464345954287:web:457e765158dadb2302681a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const moviesDiv = document.getElementById("movies");

/* LOAD MOVIES */
onValue(ref(db,"movies"), snapshot=>{
  moviesDiv.innerHTML="";
  snapshot.forEach(child=>{
    const movie = child.val();

    const card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      <img src="${movie.poster}" 
      onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
      <h3>${movie.title}</h3>
      <div class="buttons">
        <a class="watch" href="${movie.link}" target="_blank">▶ Watch</a>
        <a class="download" href="${movie.link}" target="_blank">⬇ Download</a>
      </div>
    `;

    moviesDiv.appendChild(card);
  });
});

/* ADD MOVIE */
window.addMovie = function(){
  const title = document.getElementById("title").value;
  const poster = document.getElementById("poster").value;
  const link = document.getElementById("link").value;

  if(!title || !poster || !link){
    alert("Fill all fields");
    return;
  }

  push(ref(db,"movies"),{
    title,poster,link
  });

  document.getElementById("title").value="";
  document.getElementById("poster").value="";
  document.getElementById("link").value="";
}

/* SEARCH */
document.getElementById("search").addEventListener("input", function(){
  const value = this.value.toLowerCase();
  const cards = document.querySelectorAll(".card");

  cards.forEach(card=>{
    const text = card.innerText.toLowerCase();
    card.style.display = text.includes(value) ? "block" : "none";
  });
});
</script>

</body>
</html>
