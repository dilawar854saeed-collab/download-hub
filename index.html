<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Hub by Dilawar</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b132b;
  color:white;
}

header {
  text-align:center;
  padding:20px;
  font-size:26px;
  font-weight:bold;
}

.search {
  width:80%;
  margin:20px auto;
  display:block;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

.section {
  padding:20px;
}

.grid {
  display:flex;
  flex-wrap:wrap;
  gap:20px;
}

.card {
  width:200px;
  background:#1c2541;
  border-radius:15px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.08);
}

.card img {
  width:100%;
  height:280px;
  object-fit:cover;
}

.title {
  text-align:center;
  padding:8px;
}

.buttons {
  display:flex;
  justify-content:space-around;
  padding:10px;
}

.btn {
  padding:6px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.watch { background:#3a86ff; color:white; }
.download { background:#ff006e; color:white; }

/* ADMIN */
.admin {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:15px;
  border-radius:10px;
  display:none;
}

.loginBox {
  position:fixed;
  top:30%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:20px;
  border-radius:10px;
  display:none;
}

input {
  width:100%;
  margin:5px 0;
  padding:8px;
}
</style>
</head>

<body>

<header>🚀 Download Hub by Dilawar</header>

<input class="search" placeholder="Search movies..." onkeyup="searchMovie(this.value)">

<!-- TRENDING -->
<div class="section">
  <h2>🔥 Trending</h2>
  <div class="grid" id="trending"></div>
</div>

<!-- ALL MOVIES -->
<div class="section">
  <h2>🎬 All Movies</h2>
  <div class="grid" id="allMovies"></div>
</div>

<!-- LOGIN -->
<div class="loginBox" id="loginBox">
  <h3>Admin Login</h3>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN -->
<div class="admin" id="adminPanel">
  <input id="name" placeholder="Movie Name">
  <input id="link" placeholder="Telegram Link">
  <button onclick="addMovie()">Add Movie</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDPq7MhUJZsLXd-KseYkXY04aWVkoUtT9A",
  authDomain: "downlode-hub-by-dilawar.firebaseapp.com",
  databaseURL: "https://downlode-hub-by-dilawar-default-rtdb.firebaseio.com",
  projectId: "downlode-hub-by-dilawar",
  storageBucket: "downlode-hub-by-dilawar.appspot.com",
  messagingSenderId: "464345954287",
  appId: "1:464345954287:web:457e765158dadb2302681a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const API_KEY = "9c2740d400d5fcab8638d58c8ce9454b";

let allMoviesData = [];

/* GET POSTER */
async function getPoster(name){
  try{
    let res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${name}`);
    let data = await res.json();
    if(data.results && data.results.length > 0){
      return "https://image.tmdb.org/t/p/w500" + data.results[0].poster_path;
    }
  }catch(e){}
  return "https://via.placeholder.com/300x450";
}

/* ADD MOVIE */
window.addMovie = async function(){
  let name = document.getElementById("name").value;
  let link = document.getElementById("link").value;

  if(!name || !link){
    alert("Fill all fields");
    return;
  }

  let poster = await getPoster(name);

  push(ref(db,"movies"), {
    name: name,
    link: link,
    poster: poster
  });
}

/* RENDER MOVIES */
function renderMovies(arr){
  let trending = document.getElementById("trending");
  let all = document.getElementById("allMovies");

  trending.innerHTML="";
  all.innerHTML="";

  arr.forEach((m,i)=>{
    let title = m.name || "No Title";
    let poster = m.poster || "https://via.placeholder.com/300x450";
    let link = m.link || "#";

    let card = `
    <div class="card">
      <img src="${poster}">
      <div class="title">${title}</div>
      <div class="buttons">
        <button class="btn watch" onclick="window.open('${link}')">Watch</button>
        <button class="btn download" onclick="window.open('${link}')">Download</button>
      </div>
    </div>`;

    if(i < 3) trending.innerHTML += card;
    all.innerHTML += card;
  });
}

/* LOAD FROM FIREBASE */
onValue(ref(db,"movies"), snapshot=>{
  let data = snapshot.val();

  if(!data){
    allMoviesData = [];
    renderMovies([]);
    return;
  }

  allMoviesData = Object.values(data);
  renderMovies(allMoviesData);
});

/* SEARCH */
window.searchMovie = function(val){
  let filtered = allMoviesData.filter(m =>
    (m.name || "").toLowerCase().includes(val.toLowerCase())
  );
  renderMovies(filtered);
}

/* LOGIN */
document.addEventListener("keydown", function(e){
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "l"){
    document.getElementById("loginBox").style.display="block";
  }
});

window.login = function(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u==="admin" && p==="1234"){
    document.getElementById("adminPanel").style.display="block";
    document.getElementById("loginBox").style.display="none";
  } else {
    alert("Wrong login");
  }
}
</script>

</body>
</html>
