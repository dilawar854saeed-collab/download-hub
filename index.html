<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Hub Pro Max</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b132b;
  color:white;
}

/* HEADER */
header{
  padding:15px;
  text-align:center;
  font-size:22px;
  background:#020617;
}

/* HERO */
.hero{
  height:300px;
  background:url('https://i.imgur.com/3ZQ3Z6K.jpg') center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

/* SEARCH */
.search{
  width:80%;
  margin:15px auto;
}
.search input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
}

/* CATEGORY */
.section{
  padding:10px 20px;
}
.section h2{
  margin-bottom:10px;
}

/* SCROLL ROW */
.row{
  display:flex;
  overflow-x:auto;
  gap:15px;
  padding-bottom:10px;
}

/* CARD */
.card{
  min-width:180px;
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.15);
  box-shadow:0 0 20px rgba(255,0,0,0.6);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card h4{
  text-align:center;
  padding:5px;
}

/* BUTTONS */
.btns{
  display:flex;
  justify-content:space-around;
  padding:8px;
}
.watch{background:#3b82f6;padding:5px 8px;border-radius:5px;color:white;text-decoration:none;}
.download{background:#ef4444;padding:5px 8px;border-radius:5px;color:white;text-decoration:none;}

/* ADMIN */
.admin{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111827;
  padding:15px;
  border-radius:10px;
}
.admin input{
  display:block;
  margin:5px 0;
  padding:6px;
  width:200px;
}
.admin button{
  width:100%;
  padding:6px;
  background:green;
  color:white;
  border:none;
}
</style>
</head>

<body>

<header>🚀 Download Hub PRO MAX</header>

<div class="hero">🔥 Trending Movies</div>

<div class="search">
<input type="text" id="search" placeholder="Search movies...">
</div>

<!-- TRENDING -->
<div class="section">
<h2>🔥 Trending</h2>
<div class="row" id="trending"></div>
</div>

<!-- ALL MOVIES -->
<div class="section">
<h2>🎬 All Movies</h2>
<div class="row" id="movies"></div>
</div>

<!-- ADMIN -->
<div class="admin">
<input id="title" placeholder="Title">
<input id="poster" placeholder="Poster URL">
<input id="link" placeholder="Telegram Link">
<button onclick="addMovie()">Add</button>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPq7MhUJZsLXd-KseYkXY04aWVkoUtT9A",
  authDomain: "downlode-hub-by-dilawar.firebaseapp.com",
  databaseURL: "https://downlode-hub-by-dilawar-default-rtdb.firebaseio.com",
  projectId: "downlode-hub-by-dilawar",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const moviesDiv = document.getElementById("movies");
const trendingDiv = document.getElementById("trending");

/* LOAD DATA */
onValue(ref(db,"movies"), snap=>{
  moviesDiv.innerHTML="";
  trendingDiv.innerHTML="";

  let count = 0;

  snap.forEach(child=>{
    const m = child.val();

    const html = `
    <div class="card">
      <img src="${m.poster}" onerror="this.src='https://via.placeholder.com/200x300'">
      <h4>${m.title}</h4>
      <div class="btns">
        <a class="watch" href="${m.link}" target="_blank">Watch</a>
        <a class="download" href="${m.link}" target="_blank">DL</a>
      </div>
    </div>`;

    moviesDiv.innerHTML += html;

    if(count < 5){
      trendingDiv.innerHTML += html;
      count++;
    }
  });
});

/* ADD */
window.addMovie = ()=>{
  const title = document.getElementById("title").value;
  const poster = document.getElementById("poster").value;
  const link = document.getElementById("link").value;

  push(ref(db,"movies"),{title,poster,link});
}

/* SEARCH */
document.getElementById("search").addEventListener("input",function(){
  let val = this.value.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display = c.innerText.toLowerCase().includes(val) ? "block":"none";
  });
});
</script>

</body>
</html>
