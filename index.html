<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Download Hub Ultra</title>

<style>
body{margin:0;background:#0b132b;color:#fff;font-family:sans-serif}
header{text-align:center;padding:20px;font-size:26px}
.search{width:80%;margin:20px auto;padding:12px;border-radius:10px;border:none;display:block}

.slider{display:flex;overflow-x:auto;gap:15px;padding:20px}

.card{min-width:200px;background:#1c2541;border-radius:12px;overflow:hidden}
.card img{width:100%;height:280px;object-fit:cover}

.title{text-align:center;padding:8px}
.btns{display:flex;justify-content:space-around;padding:10px}

.btn{padding:6px 10px;border:none;border-radius:8px;color:#fff}
.watch{background:#3a86ff}
.download{background:#ff006e}

.admin{position:fixed;bottom:20px;right:20px;background:#111;padding:15px;border-radius:10px;display:none}
.login{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:#111;padding:20px;display:none}

input{width:100%;margin:5px 0;padding:8px}
</style>
</head>

<body>

<header>🚀 Download Hub Ultra</header>

<input class="search" placeholder="Search..." onkeyup="searchMovie(this.value)">

<h2 style="padding-left:20px">🔥 Trending</h2>
<div class="slider" id="trending"></div>

<h2 style="padding-left:20px">🎬 All Movies</h2>
<div class="slider" id="all"></div>

<!-- ADMIN -->
<div class="login" id="login">
<input id="u" placeholder="user">
<input id="p" type="password" placeholder="pass">
<button onclick="login()">Login</button>
</div>

<div class="admin" id="admin">
<input id="name" placeholder="Movie name">
<input id="link" placeholder="Telegram link">
<button onclick="addMovie()">Add</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyDP...",
  authDomain:"downlode-hub-by-dilawar.firebaseapp.com",
  databaseURL:"https://downlode-hub-by-dilawar-default-rtdb.firebaseio.com"
});

const db = getDatabase(app);
const API="9c2740d400d5fcab8638d58c8ce9454b";

let allMovies=[];

/* 🔥 BETTER POSTER FIX */
async function getPoster(name){
  let r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API}&query=${name}&include_adult=false`);
  let d = await r.json();

  // smarter match
  let best = d.results.find(x=>x.title?.toLowerCase().includes(name.toLowerCase()));

  if(best?.poster_path){
    return "https://image.tmdb.org/t/p/w500"+best.poster_path;
  }

  if(d.results[0]?.poster_path){
    return "https://image.tmdb.org/t/p/w500"+d.results[0].poster_path;
  }

  return "https://via.placeholder.com/300x450?text=No+Image";
}

/* ADD */
window.addMovie = async ()=>{
  let name = document.getElementById("name").value.trim();
  let link = document.getElementById("link").value.trim();

  let poster = await getPoster(name);

  push(ref(db,"movies"),{
    name:name,
    link:link,
    poster:poster
  });
};

/* RENDER FIX (ULTIMATE) */
function render(arr){
  let t=document.getElementById("trending");
  let a=document.getElementById("all");

  t.innerHTML="";
  a.innerHTML="";

  arr.forEach((m,i)=>{

    let title = m.name || m.title || "No Title";
    let poster = m.poster || m.image || "https://via.placeholder.com/300x450?text=No+Image";
    let link = m.link || "#";

    let card = `
    <div class="card">
      <img src="${poster}">
      <div class="title">${title}</div>
      <div class="btns">
        <button class="btn watch" onclick="window.open('${link}')">Watch</button>
        <button class="btn download" onclick="window.open('${link}')">Download</button>
      </div>
    </div>`;

    if(i<5) t.innerHTML+=card;
    a.innerHTML+=card;
  });
}

/* LOAD */
onValue(ref(db,"movies"), snap=>{
  let data=snap.val();
  allMovies = data ? Object.values(data) : [];
  render(allMovies);
});

/* SEARCH */
window.searchMovie = (v)=>{
  let f = allMovies.filter(m => (m.name||"").toLowerCase().includes(v.toLowerCase()));
  render(f);
};

/* LOGIN */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey && e.shiftKey && e.key==="L"){
    document.getElementById("login").style.display="block";
  }
});

window.login=()=>{
  if(u.value==="admin" && p.value==="1234"){
    admin.style.display="block";
    login.style.display="none";
  }
};
</script>

</body>
</html>
