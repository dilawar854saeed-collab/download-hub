<!DOCTYPE html>
<html>
<head>
  <title>Download Hub by Dilawar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f2027;
      color: white;
    }

    header {
      text-align: center;
      padding: 20px;
      background: #203a43;
      font-size: 24px;
      font-weight: bold;
    }

    .search {
      text-align: center;
      margin: 20px;
    }

    .search input {
      width: 80%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #1c313a;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .download {
      background: #ff5722;
      color: white;
    }

    .preview {
      background: #2196f3;
      color: white;
    }
  </style>
</head>

<body>

<header>🚀 Download Hub by Dilawar</header>

<div class="search">
  <input type="text" id="searchBox" placeholder="Search movie..." onkeyup="searchMovies()">
</div>

<div class="container" id="movieList">

  <!-- Movie 1 -->
  <div class="card">
    <img src="https://via.placeholder.com/300x180.png?text=Movie+1">
    <div class="title">Dhurandhar 2025</div>

    <a href="https://t.me/downloadhubdilawar/3" target="_blank">
      <button class="preview">▶ Preview</button>
    </a>

    <a href="https://t.me/downloadhubdilawar/3?single" target="_blank">
      <button class="download">⬇ Download</button>
    </a>
  </div>

  <!-- Movie 2 -->
  <div class="card">
    <img src="https://via.placeholder.com/300x180.png?text=Movie+2">
    <div class="title">Another Movie</div>

    <a href="https://t.me/downloadhubdilawar/4" target="_blank">
      <button class="preview">▶ Preview</button>
    </a>

    <a href="https://t.me/downloadhubdilawar/4?single" target="_blank">
      <button class="download">⬇ Download</button>
    </a>
  </div>

</div>

<script>
function searchMovies() {
  let input = document.getElementById("searchBox").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    let title = card.querySelector(".title").innerText.toLowerCase();
    card.style.display = title.includes(input) ? "block" : "none";
  });
}
</script>

</body>
</html>
