<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Hub by Dilawar</title>

<!-- SEO -->
<meta name="description" content="Watch and Download Movies - Download Hub by Dilawar">
<meta name="keywords" content="movies, download, watch online, telegram movies">

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b132b;
  color:white;
}

header {
  text-align:center;
  padding:20px;
  font-size:26px;
  font-weight:bold;
}

.search {
  width:80%;
  margin:20px auto;
  display:block;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

.container {
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  padding:20px;
}

.card {
  width:220px;
  background:#1c2541;
  border-radius:15px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.1);
}

.card img {
  width:100%;
  height:300px;
  object-fit:cover;
}

.title {
  text-align:center;
  padding:10px;
}

.buttons {
  display:flex;
  justify-content:space-around;
  padding:10px;
}

.btn {
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.watch { background:#3a86ff; color:white; }
.download { background:#ff006e; color:white; }

/* ADMIN PANEL */
.admin {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:15px;
  border-radius:10px;
  display:none;
}

input {
  width:100%;
  margin:5px 0;
  padding:8px;
}

/* LOGIN */
.loginBox {
  position:fixed;
  top:30%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<header>🚀 Download Hub by Dilawar</header>

<input type="text" class="search" placeholder="Search movies..." onkeyup="searchMovie(this.value)">

<div class="container" id="movies"></div>

<!-- ADMIN LOGIN -->
<div class="loginBox" id="loginBox">
  <h3>Admin Login</h3>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="admin" id="adminPanel">
  <input id="name" placeholder="Movie Name">
  <input id="link" placeholder="Telegram Link">
  <button onclick="addMovie()">Add Movie</button>
</div>

<script>
const API_KEY = "YOUR_TMDB_API_KEY"; // 🔥 yahan apni key lagao

let movies = [];

// FETCH POSTER FROM TMDB
async function getPoster(name){
  let res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${name}`);
  let data = await res.json();
  if(data.results.length > 0){
    return "https://image.tmdb.org/t/p/w500" + data.results[0].poster_path;
  }
  return "https://via.placeholder.com/300x450";
}

// ADD MOVIE
async function addMovie(){
  let name = document.getElementById("name").value;
  let link = document.getElementById("link").value;

  let poster = await getPoster(name);

  movies.push({name, link, poster});
  displayMovies(movies);
}

// DISPLAY
function displayMovies(list){
  let box = document.getElementById("movies");
  box.innerHTML = "";

  list.forEach(m => {
    box.innerHTML += `
    <div class="card">
      <img src="${m.poster}">
      <div class="title">${m.name}</div>
      <div class="buttons">
        <button class="btn watch" onclick="watch('${m.link}')">Watch</button>
        <button class="btn download" onclick="window.open('${m.link}')">Download</button>
      </div>
    </div>`;
  });
}

// SEARCH
function searchMovie(val){
  let f = movies.filter(m => m.name.toLowerCase().includes(val.toLowerCase()));
  displayMovies(f);
}

// WATCH (embed telegram)
function watch(link){
  window.open(link);
}

// LOGIN SYSTEM (hidden)
document.addEventListener("keydown", e=>{
  if(e.ctrlKey && e.key === "l"){
    document.getElementById("loginBox").style.display="block";
  }
});

function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u==="admin" && p==="1234"){
    document.getElementById("adminPanel").style.display="block";
    document.getElementById("loginBox").style.display="none";
  } else {
    alert("Wrong login");
  }
}

// DEFAULT MOVIES (tumhari wali bhi)
movies = [
  {
    name:"Dhruv 2025",
    link:"https://t.me/downloadhubdilawar/6",
    poster:"https://via.placeholder.com/300x450"
  }
];

displayMovies(movies);
</script>

</body>
</html>
